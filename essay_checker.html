<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winson Academy – Esse yoxlama aləti</title>
<style>
  /* ===== Rənglər (Winson Academy üslubu) ===== */
  :root {
    --orange: #F26B1D;     /* əsas rəng */
    --orange-bg: #FFF4EC;  /* açıq narıncı fon */
    --text: #2B2B2B;       /* tünd boz mətn */
    --green: #2E9E4F;      /* düzgün */
    --red: #D93C3C;        /* səhv */
    --blue: #2F6FD6;       /* məlumat */
    --line: #F6D9C4;
    --muted: #6B6B6B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--orange-bg);
    color: var(--text);
    line-height: 1.5;
  }

  /* ===== Başlıq ===== */
  header {
    background: #fff;
    text-align: center;
    padding: 18px 16px 14px;
    border-bottom: 6px solid var(--orange);
  }
  header .logo { display: block; margin: 0 auto; height: 110px; width: auto; }
  header p { margin: 8px 0 0; font-size: 1.1rem; font-weight: 700; color: var(--orange); }

  /* ===== Müəllimin izahı ===== */
  .teacher { border-left: 6px solid var(--orange); }
  .teacher p { margin: 0 0 10px; line-height: 1.65; }
  .teacher p:last-child { margin-bottom: 0; }
  .teacher b { color: var(--orange); }

  main { max-width: 920px; margin: 0 auto; padding: 20px 16px 48px; }

  .panel {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 2px 10px rgba(242,107,29,.07);
  }
  .panel h2 { margin: 0 0 12px; font-size: 1.15rem; }

  .mode-line {
    display: inline-block; background: var(--orange-bg); border: 2px solid var(--orange);
    border-radius: 10px; padding: 8px 12px; font-weight: 700; margin-bottom: 14px;
  }

  .field-label { display: block; font-weight: 600; margin: 0 0 6px; }
  input[type=text], textarea {
    width: 100%;
    font: inherit;
    color: var(--text);
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    background: #fff;
  }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--orange); }
  textarea { min-height: 320px; resize: vertical; font-size: 1rem; }
  .topic-row { margin-bottom: 12px; }
  .hint { color: var(--muted); font-size: .88rem; margin-top: 4px; }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
  .btn {
    font: inherit; font-weight: 700;
    border: none; border-radius: 10px;
    padding: 12px 28px;
    cursor: pointer;
  }
  .btn-main { background: var(--orange); color: #fff; font-size: 1.05rem; }
  .btn-main:hover { filter: brightness(.94); }
  .btn-light { background: #fff; color: var(--orange); border: 2px solid var(--orange); padding: 10px 20px; }
  .live-count { margin-left: auto; color: var(--muted); font-size: .95rem; }

  /* ===== Nəticə ===== */
  #result { display: none; }
  .summary { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; }
  .circle-wrap { position: relative; width: 150px; height: 150px; flex: 0 0 150px; margin: 0 auto; }
  .circle-wrap svg { transform: rotate(-90deg); }
  .circle-text {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .circle-text b { font-size: 2rem; line-height: 1; }
  .circle-text span { color: var(--muted); font-size: .9rem; }
  .summary-info { flex: 1 1 260px; }
  .summary-info .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .chip {
    background: var(--orange-bg); border: 1px solid var(--line);
    border-radius: 20px; padding: 3px 12px; font-size: .9rem;
  }
  .final-msg { font-weight: 700; margin: 6px 0; }
  .final-msg.good { color: var(--green); }
  .note { color: var(--blue); font-size: .93rem; margin: 6px 0 0; }

  .alert {
    border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-weight: 600;
  }
  .alert.red  { background: #FBEAEA; color: var(--red); border: 1px solid #F1C2C2; }
  .alert.blue { background: #EAF1FC; color: var(--blue); border: 1px solid #C6D7F4; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .card {
    background: #fff; border: 1px solid var(--line); border-top: 5px solid var(--orange);
    border-radius: 12px; padding: 14px 16px;
  }
  .card.full { border-top-color: var(--green); }
  .card.zero { border-top-color: var(--red); }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-head h3 { margin: 0; font-size: 1rem; }
  .badge {
    flex: 0 0 auto; font-weight: 800; border-radius: 8px; padding: 2px 10px; color: #fff;
    background: var(--orange);
  }
  .card.full .badge { background: var(--green); }
  .card.zero .badge { background: var(--red); }
  .card ul { list-style: none; padding: 0; margin: 10px 0 0; }
  .card li { padding: 3px 0 3px 24px; position: relative; font-size: .93rem; }
  .card li::before { position: absolute; left: 0; font-weight: 800; }
  li.ok::before   { content: "✓"; color: var(--green); }
  li.bad::before  { content: "✗"; color: var(--red); }
  li.info::before { content: "i"; color: var(--blue); left: 5px; }
  li.info { color: var(--blue); }
  li.forgiven::before { content: "~"; color: var(--blue); left: 3px; }
  li.forgiven { color: var(--blue); }

  .errors { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .err { font-size: .9rem; margin: 4px 0; }
  .code {
    display: inline-block; min-width: 40px; text-align: center;
    background: var(--red); color: #fff; font-weight: 800; font-size: .78rem;
    border-radius: 6px; padding: 1px 6px; margin-right: 6px;
  }
  .code.info { background: var(--blue); }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: .9rem; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  th { background: var(--orange-bg); }

  .checklist label { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; cursor: pointer; }
  .checklist input { accent-color: var(--green); width: 18px; height: 18px; margin-top: 3px; flex: 0 0 auto; }

  .legend { font-size: .9rem; }
  .legend div { margin: 4px 0; }

  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 0 16px 24px; }

  /* ===== Telefon ===== */
  @media (max-width: 560px) {
    header .logo { height: 86px; }
    main { padding: 14px 10px 36px; }
    .panel { padding: 14px; }
    textarea { min-height: 260px; }
    .btn-main { width: 100%; }
    .live-count { margin-left: 0; width: 100%; text-align: center; }
  }
</style>
</head>

  </section>

  <section id="result"></section>
</main>

<footer>Bütün yoxlama brauzerdə aparılır. Heç bir məlumat serverə göndərilmir.</footer>

<script>
/* ==========================================================
   1. SÖZ SİYAHILARI (istəsəniz buradan dəyişə bilərsiniz)
   ========================================================== */

// Əks fikir göstəriciləri (B meyarında "həm lehinə, həm əleyhinə" üçün)
const COUNTER_MARKERS = ["some people", "however", "although", "on the other hand",
  "others believe", "others argue", "opponents", "even though", "despite", "nevertheless"];

// Şəxsi fikir göstəriciləri (lehinə fikir siyahısına daxildir)
const OPINION_MARKERS = ["i believe", "in my opinion", "i think", "in my view",
  "personally", "from my point of view", "i strongly believe", "i agree", "i disagree"];

// Yekun ifadələri (son cümlə bunlardan biri ilə başlamalıdır)
const CONCLUSION_MARKERS = ["in conclusion", "to sum up", "overall", "to conclude",
  "in summary", "all in all", "to summarize"];

// Nümunə və səbəb göstəriciləri
const EXAMPLE_MARKERS = ["for example", "for instance", "such as", "because", "since"];

// Bağlayıcı sözlər
// Kitabdakı bağlayıcılar: əlavə, səbəb, nümunə, əks fikir, nəticə, ardıcıllıq, yekunlaşdırma
const LINKERS = ["also", "in addition", "moreover", "furthermore",
  "because", "since", "because of", "due to",
  "for example", "for instance", "such as",
  "however", "although", "while", "but", "even though", "on the other hand",
  "therefore", "as a result", "consequently",
  "first", "firstly", "second", "secondly", "next", "then", "finally",
  "in conclusion", "to conclude", "to sum up", "overall", "in summary"];

// Lehinə fikir göstəriciləri
const PRO_MARKERS = OPINION_MARKERS.concat(["advantage", "advantages", "benefit", "benefits",
  "positive", "useful", "helpful", "important"]);

// Əleyhinə fikir göstəriciləri
const CON_MARKERS = COUNTER_MARKERS.concat(["disadvantage", "disadvantages", "drawback",
  "drawbacks", "negative", "harmful"]);

// Mürəkkəb cümlə göstəriciləri
const COMPLEX_MARKERS = ["because", "although", "which", "that", "when", "if", "while", "since"];

// Funksional sözlər (D meyarında çıxarılır).
// İlk sətir tapşırıqdakı siyahıdır, ikinci sətir əlavə ümumi sözlərdir.
const FUNCTION_WORDS = new Set([
  "the","a","an","is","are","of","to","and","in","it","this","that","i","they",
  "be","was","were","for","on","with","as","at","by","or","but","so","not","can","will",
  "we","you","he","she","my","our","their","its","them","me","us","do","does","have","has",
  "there","these","those","which","who","if","because","also","very"
]);

// Kitabdakı şablon ifadələr (əzbər cümlələr – üslub xəbərdarlığı)
const TEMPLATE_PHRASES = ["nowadays, this is a very important topic",
  "there are many advantages and disadvantages", "in this paragraph, i will",
  "in this essay, i will", "this essay will discuss"];

// Mövzunun elan edilməsi (announcement) – topic sentence kimi qəbul olunmur
const ANNOUNCEMENT_RE = /\b(in this (paragraph|essay)|i will (write|discuss|talk|explain)|this essay (will|is about))\b/i;

// Kitabdakı cümlə modelləri (B meyarında məlumat üçün sayılır)
const PATTERNS = [
  { name: "I believe that", re: /\bi (believe|think) that\b/i },
  { name: "In my opinion", re: /\b(in my opinion|from my point of view|as far as i am concerned)\b/i },
  { name: "One important reason is that", re: /\bone important reason is that\b/i },
  { name: "This is because", re: /\bthis is because\b/i },
  { name: "The main reason for this is that", re: /\bthe main reason for this is that\b/i },
  { name: "This means that", re: /\bthis means that\b/i },
  { name: "In other words", re: /\bin other words\b/i },
  { name: "Students should be allowed to", re: /\bshould be allowed to\b/i },
  { name: "Rather than", re: /\brather than\b/i },
  { name: "Although + idea", re: /\balthough\b/i },
  { name: "As a result", re: /\bas a result\b/i },
  { name: "Some people argue", re: /\bsome people (argue|believe|think|say)\b/i },
  { name: "On the other hand", re: /\bon the other hand\b/i },
  { name: "Such as", re: /\bsuch as\b/i }
];

// Kitabdakı 8 mövzunun lüğəti (tək sözlər) – D meyarında məlumat üçün
const TOPIC_WORDS = new Set(("impact advantage disadvantage benefit innovation influence tool solution communication distraction privacy security access entertainment society development facilitate rely connect transform replace consume harm improve limit allow create modern convenient harmful useful virtual global efficient artificial dangerous essential instant reliable " +
  "improvement knowledge skill opportunity environment method approach performance achievement challenge curriculum literacy resource motivation provide acquire encourage focus participate achieve require evaluate enhance prepare overcome adapt support educational effective beneficial interactive mandatory practical academic independent competitive " +
  "heritage tradition diversity identity masterpiece exhibition value belief generation custom perspective symbol creativity audience foundation preserve represent reflect appreciate inherit express celebrate promote respect perform cultural traditional unique diverse historical valuable ancient creative universal significant authentic contemporary " +
  "plot character viewer genre director scene message review industry soundtrack effect script episode hero protagonist portray depict convey entertain inspire direct recommend release nominate shoot captivate entertaining inspiring realistic fictional emotional thrilling spectacular predictable outstanding violent moving " +
  "habitat extinction pollution species ecosystem conservation deforestation predator prey emission waste threat mammal protect survive pollute destroy endanger conserve threaten recycle vanish reduce environmental endangered wild domestic sustainable toxic natural cruel renewable rare vital " +
  "destination tourism landmark accommodation journey infrastructure horizon resident sightseeing landscape experience border distance souvenir guide transport explore broaden attract discover commute book immerse navigate encounter depart foreign local historic breathtaking crowded picturesque remote accessible unforgettable hospitable scenic commercial " +
  "career profession qualification salary employee employer colleague productivity responsibility promotion unemployment workplace requirement balance retirement hire resign earn collaborate manage pursue supervise dismiss overwork negotiate professional demanding rewarding dedicated qualified ambitious lucrative stressful flexible " +
  "teamwork discipline bond trust competition conflict rival commitment defeat argument mutual collaboration resilience empathy perseverance foster endurance resolution harmony solidarity dedication cultivate strategy well sportsmanship mentorship adversary coordinate interpersonal resolve outcome tension obligation crucial tolerate contribute participation").split(" "));

// İngilis dilini tanımaq üçün ən çox işlənən sözlər
const ENGLISH_COMMON = new Set(["the","a","an","is","are","of","to","and","in","it","this",
  "that","i","they","for","on","with","be","have","not","can","people","we","you","my","their"]);

/* ==========================================================
   2. SAYMA FUNKSİYALARI
   ========================================================== */

// Mətndəki sözləri kiçik hərflə massiv kimi qaytarır
function getWords(text) {
  return text.toLowerCase().match(/[a-z]+(?:'[a-z]+)?/g) || [];
}

// Mətni cümlələrə bölür (. ! ? işarələrinə görə)
function getSentences(text) {
  return text.replace(/\s+/g, " ").trim()
    .split(/(?<=[.!?])\s+/)
    .map(s => s.trim())
    .filter(s => getWords(s).length > 0);
}

// Mətni paraqraflara bölür (boş sətirə görə)
function getParagraphs(text) {
  return text.trim().split(/\n\s*\n/).map(p => p.trim()).filter(p => p.length > 0);
}

// Mətndə siyahıdakı ifadələrdən hansılarının olduğunu tapır
function findPhrases(text, list) {
  const lower = " " + text.toLowerCase().replace(/[^a-z']+/g, " ") + " ";
  return list.filter(p => lower.includes(" " + p + " "));
}

// Cümlə siyahıdakı ifadələrdən biri ilə başlayırmı?
function startsWithAny(sentence, list) {
  const s = getWords(sentence).join(" ");
  return list.some(p => s === p || s.startsWith(p + " "));
}

// Cümlənin qısa hissəsini göstərmək üçün (ilk 8 söz)
function snippet(sentence) {
  const parts = sentence.split(/\s+/);
  return parts.length > 8 ? parts.slice(0, 8).join(" ") + "…" : sentence;
}

// HTML üçün təhlükəsiz mətn
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ==========================================================
   3. ÜMUMİ YOXLAMALAR (dil, mövzu)
   ========================================================== */

// Mətn ingilis dilindədirmi və oxunurmu?
function checkLanguage(text, words) {
  const letters = (text.match(/\p{L}/gu) || []).length;
  const nonLatin = (text.match(/[^\x00-\x7F]/g) || []).filter(c => /\p{L}/u.test(c)).length;
  if (words.length < 5) return { ok: false, reason: "Mətn çox qısadır və ya oxunmur." };
  if (letters > 0 && nonLatin / letters > 0.05)
    return { ok: false, reason: "Mətn ingilis dilində deyil (başqa dildə yazılıb)." };
  const common = words.filter(w => ENGLISH_COMMON.has(w)).length;
  if (common / words.length < 0.12)
    return { ok: false, reason: "Mətn oxunmur və ya ingilis dilində deyil." };
  return { ok: true };
}

// Mövzu sözləri mətndə varmı? (sadə yoxlama: sözün ilk 5 hərfi)
function checkTopic(topic, words) {
  const topicWords = getWords(topic).filter(w => !FUNCTION_WORDS.has(w) && w.length > 3);
  if (topicWords.length === 0) return { checked: false, ok: true };
  const stems = new Set(words.map(w => w.slice(0, 5)));
  const found = topicWords.filter(w => stems.has(w.slice(0, 5)));
  return { checked: true, ok: found.length > 0, found };
}

/* ==========================================================
   4. MEYARLAR (rəsmi qiymətləndirmə cədvəlinə uyğun)
   ========================================================== */

// Görməzdən gəlinən kiçik səhvlərin sayı (bu qədər səhv bal azaltmır)
const FORGIVE_LIMIT = 3;
let forgiveLeft = FORGIVE_LIMIT;

// Yumşaq yoxlama: şərt ödənməyibsə və limit qalıbsa, səhv görməzdən gəlinir.
// Qaytarır: true (ödənib), "forgiven" (görməzdən gəlindi), false (səhv)
// Söz sayı, dil və mövzu yoxlamaları bu funksiyadan keçmir – onlar həmişə sərtdir.
function soft(ok) {
  if (ok) return true;
  if (forgiveLeft > 0) { forgiveLeft--; return "forgiven"; }
  return false;
}

// Dəstəkləyici cümlələr: ilk və son cümlədən başqa, ən azı 6 sözlük cümlələr
function getSupportingSentences(sentences) {
  return sentences.slice(1, -1).filter(s => getWords(s).length >= 6);
}

// A – Tapşırığın yerinə yetirilməsi (0–1)
// 1: həcm ≥100 söz və 4 element tam (əsas fikir, dəstəkləyici fikirlər, yekun fikir, əlaqə)
// 0.5: həcm 70–99 söz və ya struktur elementlərindən ən azı biri var
// 0: həcm 70-dən az və ya struktur elementləri yoxdur
function checkA(text, words, sentences) {
  const items = [], errors = [], warnings = [];
  const wc = words.length;

  // Söz sayı balı
  let lenScore = 0;
  if (wc >= 100) lenScore = 1;
  else if (wc >= 70) { lenScore = 0.5; errors.push(["LEN", `Mətndə ${wc} söz var. Tam bal üçün ən azı 100 söz lazımdır.`]); }
  else errors.push(["LEN", `Mətndə cəmi ${wc} söz var. 70-dən az söz 0 bal alır (tələb: 100+).`]);
  items.push([wc >= 100, `Söz sayı: ${wc}`]);

  // Tək paraqraf yoxlaması (boş sətir varsa xəbərdarlıq)
  const paras = getParagraphs(text);
  if (paras.length > 1) {
    warnings.push("Tək paraqraf tələb olunur.");
    errors.push(["STR", `Tək paraqraf tələb olunur. Mətndə ${paras.length} abzas (boş sətir) var.`]);
  }

  // Struktur elementləri
  const first = sentences[0] || "";
  const last = sentences[sentences.length - 1] || "";
  const support = getSupportingSentences(sentences);
  const linkers = findPhrases(text, LINKERS);

  const checks = [
    [getWords(first).length >= 6 && !first.endsWith("?") && !startsWithAny(first, CONCLUSION_MARKERS) && !ANNOUNCEMENT_RE.test(first),
      "Əsas fikir cümləsi (topic sentence)",
      ANNOUNCEMENT_RE.test(first)
        ? `1-ci cümlə ("${snippet(first)}") elan (announcement) cümləsidir. Əsas fikri birbaşa yazın.`
        : `1-ci cümlə ("${snippet(first)}") əsas fikri aydın bildirmir (çox qısadır və ya sualdır).`],
    [support.length >= 2, `Dəstəkləyici fikirlər: ${support.length}`,
      `Ən azı 2 dəstəkləyici cümlə lazımdır, ${support.length} tapıldı.`],
    [startsWithAny(last, CONCLUSION_MARKERS), "Yekun fikir",
      `Son cümlə ("${snippet(last)}") yekun ifadəsi ilə başlamır ("In conclusion", "To sum up", "Overall").`],
    [linkers.length >= 1, "Cümlələr arasında əlaqə (bağlayıcı söz)",
      `Cümlələr arasında heç bir bağlayıcı söz tapılmadı ("however", "moreover", "therefore" kimi).`]
  ];

  checks.forEach(c => { c[0] = soft(c[0]); });
  checks.forEach(([ok, label, err]) => {
    items.push([ok, label]);
    if (ok !== true) errors.push(["STR", err, ok === "forgiven" ? "info" : ""]);
  });

  // Şablon ifadə varsa məlumat xəbərdarlığı (bala təsir etmir)
  const tpl = TEMPLATE_PHRASES.filter(p => text.toLowerCase().includes(p));
  if (tpl.length) errors.push(["STR", `Şablon ifadə tapıldı: "${tpl[0]}". Mövzuya uyğun öz cümlənizi yazın.`, "info"]);

  const found = checks.filter(c => c[0] !== false).length;
  const strScore = found === checks.length ? 1 : found >= 1 ? 0.5 : 0;

  // A balı: söz sayı və struktur balından kiçik olanı
  const score = Math.min(lenScore, strScore);
  items.push(["info", `Söz sayı balı: ${lenScore}, struktur balı: ${strScore} (${found}/${checks.length} element)`]);
  return { score, max: 1, items, errors, warnings, support };
}

// B – Mövzunun əhatə edilməsi və məntiqi ardıcıllıq (0–2)
// 2: ən azı 2 fikir, nümunə/izah, bağlayıcılar, həm lehinə, həm əleyhinə
// 1: bu şərtlərdən bir neçəsi var (məhdud arqument, bir tərəf, az bağlayıcı)
// 0: heç bir şərt yoxdur
function checkB(text, support) {
  const items = [], errors = [];

  const argsOk = soft(support.length >= 2);
  items.push([argsOk, `Aydın fikir/arqument: ${support.length}`]);

  const examples = findPhrases(text, EXAMPLE_MARKERS);
  const exOk = soft(examples.length > 0);
  items.push([exOk, "Nümunə/səbəb: " + (examples.length ? examples.map(e => `"${e}"`).join(", ") : "tapılmadı")]);

  const linkers = findPhrases(text, LINKERS);
  const lnkOk = soft(linkers.length >= 3);
  items.push([lnkOk, `Fərqli bağlayıcı sayı: ${linkers.length}` + (linkers.length ? ` (${linkers.join(", ")})` : "")]);
  if (lnkOk !== true) errors.push(["LNK", linkers.length
    ? `Yalnız ${linkers.length} fərqli bağlayıcı işlənib: ${linkers.map(l => `"${l}"`).join(", ")}. Ən azı 3 fərqli bağlayıcı işlədin (moreover, therefore, in addition...).`
    : `Bağlayıcı söz tapılmadı. "Firstly", "moreover", "however", "therefore" kimi sözlər işlədin.`,
    lnkOk === "forgiven" ? "info" : ""]);

  const pro = findPhrases(text, PRO_MARKERS).length > 0;
  const con = findPhrases(text, CON_MARKERS).length > 0;
  const bothOk = soft(pro && con);
  items.push([bothOk, "Həm lehinə, həm əleyhinə fikir" + (!(pro && con) ? (pro ? " (yalnız lehinə)" : con ? " (yalnız əleyhinə)" : "") : "")]);

  // Görməzdən gəlinən səhvlər ödənmiş kimi sayılır
  const count = [argsOk, exOk, lnkOk, bothOk].filter(x => x !== false).length;
  const score = count === 4 ? 2 : count >= 1 ? 1 : 0;
  const pats = PATTERNS.filter(p => p.re.test(text)).map(p => p.name);
  items.push(["info", `Kitabdakı cümlə modelləri: ${pats.length}` + (pats.length ? ` (${pats.slice(0, 4).join(", ")})` : "")]);
  items.push(["info", "Mövzuya uyğunluq və arqumentlərin keyfiyyəti avtomatik tam yoxlanmır – aşağıdakı müəllim siyahısına baxın."]);
  return { score, max: 2, items, errors };
}

// C – Qrammatik qaydalara əməl (0–1)
// 1: müxtəlif sadə və mürəkkəb cümlələr düzgün istifadə olunub
// 0.5: əsasən sadə, qısa və ya şablon cümlələr
// 0: cümlə qurulmayıb
function checkC(sentences) {
  const items = [], errors = [];
  if (sentences.length === 0) return { score: 0, max: 1, items: [[false, "Cümlə qurulmayıb"]], errors };

  const complex = sentences.filter(s => findPhrases(s, COMPLEX_MARKERS).length > 0);
  const markersUsed = new Set(sentences.flatMap(s => findPhrases(s, COMPLEX_MARKERS)));
  const complexOk = soft(complex.length >= 2);
  const markersOk = soft(markersUsed.size >= 2);
  items.push([complexOk, `Mürəkkəb cümlə sayı: ${complex.length} / ${sentences.length}`]);
  items.push([markersOk, `Fərqli mürəkkəb göstəricilər: ${markersUsed.size}` + (markersUsed.size ? ` (${[...markersUsed].join(", ")})` : "")]);

  const lengths = sentences.map(s => getWords(s).length);
  const avg = lengths.reduce((a, b) => a + b, 0) / lengths.length;
  const shortIdx = lengths.map((l, i) => l < 8 ? i : -1).filter(i => i >= 0);
  const mostlyShort = shortIdx.length / sentences.length > 0.5;
  const shortOk = soft(!mostlyShort);
  items.push([shortOk, `Ortalama cümlə uzunluğu: ${avg.toFixed(1)} söz`]);

  if (mostlyShort) {
    const t = shortOk === "forgiven" ? "info" : "";
    shortIdx.slice(0, 5).forEach(i =>
      errors.push(["SNT", `${i + 1}-ci cümlə ("${snippet(sentences[i])}") cəmi ${lengths[i]} sözdür – qısa/şablon cümlə.`, t]));
    if (shortIdx.length > 5) errors.push(["SNT", `Daha ${shortIdx.length - 5} qısa cümlə var.`, t]);
  }
  // Çox uzun cümlələr (məlumat üçün)
  lengths.forEach((l, i) => {
    if (l > 40) errors.push(["SNT", `${i + 1}-ci cümlə ("${snippet(sentences[i])}") ${l} sözdür – çox uzundur, bölməyi düşünün.`, "info"]);
  });

  let score;
  if (sentences.length < 2 && lengths[0] < 5) score = 0;
  else if (complexOk !== false && markersOk !== false && shortOk !== false) score = 1;
  else score = 0.5;

  items.push(["info", "Zaman, artikl və fel forması səhvləri avtomatik yoxlanmır – müəllim yoxlaması lazımdır."]);
  return { score, max: 1, items, errors };
}

// D – Söz ehtiyatının müxtəlifliyi (0–1)
// 1: zəngin söz ehtiyatı, leksik təkrar yoxdur
// 0.5: kifayət qədər söz ehtiyatı, bəzən təkrar var
// 0: bəsit söz ehtiyatı, yersiz təkrarlar
function checkD(words) {
  const items = [], errors = [];
  const content = words.filter(w => !FUNCTION_WORDS.has(w) && w.length > 1);
  if (content.length === 0) return { score: 0, max: 1, items: [[false, "Məzmun sözü tapılmadı"]], errors, repeated: [] };

  // Hər sözün neçə dəfə işləndiyini say
  const freq = {};
  content.forEach(w => { freq[w] = (freq[w] || 0) + 1; });
  const unique = Object.keys(freq).length;
  const ratio = unique / content.length;
  const repeated = Object.entries(freq).filter(([, n]) => n >= 3).sort((a, b) => b[1] - a[1]);

  const ratioOk = soft(ratio >= 0.6);
  const repOk = soft(repeated.length <= 2);
  items.push([ratioOk, `Unikal söz nisbəti: ${ratio.toFixed(2)} (${unique} / ${content.length})`]);
  items.push([repOk, `3+ dəfə təkrarlanan sözlər: ${repeated.length}`]);
  repeated.forEach(([w, n]) => errors.push(["WW", `"${w}" sözü ${n} dəfə işlənib. Sinonim işlədin.`]));

  const topicHits = Object.keys(freq).filter(w => TOPIC_WORDS.has(w));
  items.push(["info", `Kitabın mövzu lüğətindən söz: ${topicHits.length}`]);

  let score;
  if (ratioOk !== false && repOk !== false) score = 1;
  else if (ratio >= 0.45 && repeated.length <= 4) score = 0.5;
  else score = 0;
  return { score, max: 1, items, errors, repeated };
}

/* ==========================================================
   5. BAL HESABLANMASI
   ========================================================== */
function analyze(text, topic) {
  const words = getWords(text);
  const sentences = getSentences(text);
  const res = { text, topic, words, sentences, alerts: [] };
  forgiveLeft = FORGIVE_LIMIT; // hər yoxlamada limit yenidən başlayır

  const A = checkA(text, words, sentences);
  const B = checkB(text, A.support);
  const C = checkC(sentences);
  const D = checkD(words);
  res.crit = { A, B, C, D };
  A.warnings.forEach(w => res.alerts.push(["red", w]));

  // Qayda: başqa dildə yazılmış və ya oxunmayan mətn 0 bal alır
  const lang = checkLanguage(text, words);
  // Qayda: mövzudan kənar mətn 0 bal alır
  const top = checkTopic(topic, words);

  let zeroAll = null;
  if (!lang.ok) zeroAll = lang.reason + " Belə mətn 0 bal alır.";
  else if (top.checked && !top.ok) zeroAll = "Mətndə mövzuya aid söz tapılmadı – mövzudan kənar ola bilər. Belə mətn 0 bal alır (müəllim təsdiqləməlidir).";
  else if (top.checked) res.alerts.push(["blue", `Mövzu sözləri tapıldı: ${top.found.join(", ")}`]);

  if (zeroAll) {
    res.alerts.unshift(["red", zeroAll]);
    res.zeroReason = zeroAll;
    Object.values(res.crit).forEach(c => c.score = 0);
  } else if (A.score === 0) {
    // Qayda: A balı 0-dırsa, yekun qiymət 0-dır, B, C, D qiymətləndirilmir
    B.score = 0; C.score = 0; D.score = 0;
    res.aZero = true;
    res.alerts.push(["red", "A meyarı 0 bal olduğu üçün yekun qiymət 0-dır. B, C və D meyarları qiymətləndirilmir."]);
  } else if (B.score === 0) {
    // Qayda: B balı 0-dırsa, C və D də 0
    C.score = 0; D.score = 0;
    res.alerts.push(["red", "B meyarı 0 bal olduğu üçün C və D meyarları da 0 bal hesab olunur."]);
  }

  res.forgiven = FORGIVE_LIMIT - forgiveLeft;
  res.total = A.score + B.score + C.score + D.score;
  return res;
}

   6. GÖSTƏRMƏ (nəticəni ekrana çıxarmaq)

const CRIT_TITLES = {
  A: "A – Tapşırığın yerinə yetirilməsi",
  B: "B – Mövzunun əhatəsi və məntiqi ardıcıllıq",
  C: "C – Qrammatik qaydalara əməl",
  D: "D – Söz ehtiyatının müxtəlifliyi"
};

const CODE_INFO = {
  LEN: "Söz sayı tələbə uyğun deyil.",
  STR: "Struktur elementi çatışmır.",
  LNK: "Bağlayıcı sözlər azdır.",
  WW:  "Eyni söz çox təkrarlanır.",
  SNT: "Cümlə uzunluğu ilə bağlı problem."
};

// Bal dairəsi (SVG)
function renderCircle(total) {
  const r = 62, c = 2 * Math.PI * r;
  const part = c * (total / 5);
  const color = total >= 4 ? "var(--green)" : total >= 2 ? "var(--orange)" : "var(--red)";
  return `
    <div class="circle-wrap">
      <svg width="150" height="150" viewBox="0 0 150 150">
        <circle cx="75" cy="75" r="${r}" fill="none" stroke="#F6D9C4" stroke-width="12"/>
        <circle cx="75" cy="75" r="${r}" fill="none" stroke="${color}" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="${part} ${c}"/>
      </svg>
      <div class="circle-text"><b>${total}</b><span>/ 5 bal</span></div>
    </div>`;
}

// Bir meyar kartı
function renderCard(key, c) {
  const cls = c.score === c.max ? "full" : c.score === 0 ? "zero" : "";
  const list = c.items.map(([ok, label]) =>
    ok === "forgiven"
      ? `<li class="forgiven">${esc(label)} (görməzdən gəlindi)</li>`
      : `<li class="${ok === "info" ? "info" : ok ? "ok" : "bad"}">${esc(label)}</li>`).join("");
  // WW səhvləri D kartında cədvəl şəklində göstərilir, digərləri siyahı şəklində
  const listErrors = c.errors.filter(e => e[0] !== "WW");
  const errs = listErrors.length
    ? `<div class="errors">${listErrors.map(([code, msg, type]) =>
        `<div class="err"><span class="code ${type === "info" ? "info" : ""}">${code}</span>${esc(msg)}</div>`).join("")}</div>`
    : "";
  let table = "";
  if (key === "D" && c.repeated && c.repeated.length) {
    table = `<table><tr><th>Kod</th><th>Söz</th><th>Sayı</th><th>İzah</th></tr>
      ${c.repeated.map(([w, n]) => `<tr><td><span class="code">WW</span></td><td>${esc(w)}</td><td>${n}</td>
        <td>"${esc(w)}" sözü ${n} dəfə işlənib.</td></tr>`).join("")}</table>`;
  }
  return `
    <div class="card ${cls}">
      <div class="card-head"><h3>${CRIT_TITLES[key]}</h3><span class="badge">${c.score} / ${c.max}</span></div>
      <ul>${list}</ul>${table}${errs}
    </div>`;
}

// Müəllim yoxlaması siyahısı
function renderChecklist() {
  const qs = [
    "Esse mövzuya uyğundurmu?",
    "Arqumentlər inandırıcıdırmı, nümunələr real və uyğundurmu?",
    "Qrammatik səhvlər (zaman, artikl, fel forması) varmı?",
    "Söz birləşmələri (collocations) təbiidirmi?"

  return `
    <div class="panel checklist">

      <p class="note">Qeyd: eyni qrammatik qaydanın təkrarlanan səhvləri bir səhv hesab olunur.</p>

}

/* ==========================================================
   6b. MÜƏLLİMİN İZAHI (şagirdə təbii dildə rəy)
   ========================================================== */

// Tez-tez təkrarlanan sözlər üçün sinonimlər (kitabdakı parafraz nümunələri əsasında)
const SYNONYMS = {
  important: ["essential", "crucial", "significant"],
  good: ["beneficial", "useful", "positive"],
  bad: ["harmful", "negative"],
  many: ["a large number of", "numerous"],
  very: ["highly", "extremely"],
  difficult: ["challenging"],
  help: ["support", "assist"],
  helps: ["supports", "allows"],
  big: ["significant", "major"],
  people: ["individuals", "society"],
  think: ["believe", "consider"],
  students: ["learners", "pupils"],
  children: ["young people", "kids"],
  teenagers: ["adolescents", "young people"],
  phones: ["smartphones", "mobile devices"],
  learn: ["master", "acquire"],
  problem: ["issue", "challenge"],
  problems: ["issues", "challenges"],
  useful: ["beneficial", "helpful"],
  show: ["demonstrate"],
  make: ["create"],
  get: ["receive", "obtain"],
  use: ["make use of", "rely on"],
  like: ["enjoy", "prefer"],
  nice: ["pleasant"],
  fun: ["enjoyable", "entertaining"]
};

// Bağlayıcı qrupları (kitabdakı bölgüyə görə)
const LINKER_GROUPS = [
  { name: "əlavə fikir", list: ["also", "in addition", "moreover", "furthermore"], ex: "In addition, ..." },
  { name: "ardıcıllıq", list: ["first", "firstly", "second", "secondly", "next", "then", "finally"], ex: "Firstly, ... Secondly, ..." },
  { name: "nəticə", list: ["therefore", "as a result", "consequently"], ex: "As a result, ..." },
  { name: "əks fikir", list: ["however", "although", "while", "but", "even though", "on the other hand"], ex: "However, ..." }
];

// Cümləni dırnaq içində qısa göstərir
function quote(s) { return `"${esc(snippet(s))}"`; }

// Müəllimin şagirdə yazdığı kimi izah: hər bölmə üçün nə yaxşıdır, nə düzəldilməlidir
function teacherFeedback(res) {
  const text = res.text, words = res.words, sentences = res.sentences;
  const out = [];
  if (res.zeroReason) {
    out.push(`Bu dəfə bal verə bilmədim. ${esc(res.zeroReason)} Mətni ingilis dilində və verilən mövzuya uyğun yaz, sonra yenidən yoxla.`);
    return out;
  }

  const good = [], next = [];
  const structure = [], content = [], grammar = [], vocab = [];
  const first = sentences[0] || "", last = sentences[sentences.length - 1] || "";
  const support = getSupportingSentences(sentences);
  const wc = words.length;

  // --- Quruluş (A) ---
  if (wc < 70) {
    structure.push(`Mətnin cəmi ${wc} sözdür. İmtahanda ən azı 100 söz tələb olunur, 70 sözdən az olanda isə yazı ümumiyyətlə qiymətləndirilmir. Fikirlərini genişləndir: hər səbəbdən sonra özünə "Why?" və "How?" sualını ver və cavabını bir cümlə ilə yaz.`);
    next.push("mətni ən azı 100 sözə çatdırmaq");
  } else if (wc < 100) {
    structure.push(`Mətnin ${wc} sözdür, tam bal üçün isə ən azı 100 söz lazımdır. Daha ${100 - wc} söz qazanmaq üçün bir fikrini izah et ("This means that ...") və ya konkret nümunə ver.`);
    next.push("100 söz həddinə çatmaq");
  } else good.push("söz sayı tələbə uyğundur");

  const paras = getParagraphs(text);
  if (paras.length > 1)
    structure.push(`Mətni ${paras.length} abzasa bölmüsən. Bu tapşırıqda bütün cümlələr bir paraqrafda, ard-arda gəlməlidir.`);

  if (ANNOUNCEMENT_RE.test(first)) {
    structure.push(`Birinci cümlən (${quote(first)}) nə haqqında yazacağını elan edir. Sən məruzəçi deyilsən: elan etmək əvəzinə əsas fikrini birbaşa yaz. Məsələn: "Smoking is a dangerous habit because it causes serious health problems."`);
    next.push("topic sentence-i elan kimi yox, əsas fikir kimi yazmaq");
  } else if (getWords(first).length < 6 || first.endsWith("?")) {
    structure.push(`Birinci cümlən (${quote(first)}) əsas fikri aydın göstərmir. Yaxşı topic sentence iki suala cavab verir: mövzu nədir və sənin bu mövzu haqqında fikrin nədir? Cümləyə səbəbini də əlavə et: "... because ...".`);
    next.push("güclü topic sentence yazmaq");
  } else good.push("birinci cümlən əsas fikri aydın bildirir");

  if (support.length < 2) {
    structure.push(`Dəstəkləyici fikirlərin azdır (${support.length}). Ən azı iki səbəb göstər və onları "Firstly, ..." və "Secondly, ..." ilə başla ki, oxucu fikirlərini asan izləsin.`);
    next.push("ən azı iki dəstəkləyici fikir yazmaq");
  } else good.push(`${support.length} dəstəkləyici cümlə ilə fikrini inkişaf etdirmisən`);

  if (!startsWithAny(last, CONCLUSION_MARKERS)) {
    structure.push(`Son cümlən (${quote(last)}) yekun kimi başlamır. Paraqrafı "In conclusion, ...", "To sum up, ..." və ya "Overall, ..." ilə bitir və birinci cümlədəki fikri başqa sözlərlə təkrarla. Yadda saxla: yekunda yeni fikir yazmaq olmaz.`);
    next.push("yekun cümləni düzgün yazmaq");
  } else {
    // Yekun birinci cümləni sözbəsöz təkrarlayırmı?
    const a = new Set(getWords(first).filter(w => !FUNCTION_WORDS.has(w) && w.length > 3));
    const b = new Set(getWords(last).filter(w => !FUNCTION_WORDS.has(w) && w.length > 3));
    const shared = [...a].filter(w => b.has(w)).length;
    if (a.size >= 4 && shared / a.size > 0.7)
      structure.push(`Yekun cümlən birinci cümləni demək olar ki, eyni sözlərlə təkrarlayır. Yoxlayıcı bunu sözbəsöz təkrar kimi görür. Sinonimlərdən istifadə et və cümlənin quruluşunu dəyiş, yəni parafraz et.`);
    else good.push("yekun cümlən əsas fikri yenidən xatırladır");
  }

  const tpl = TEMPLATE_PHRASES.filter(p => text.toLowerCase().includes(p));
  if (tpl.length)
    structure.push(`"${esc(tpl[0])}" kimi hazır şablonlardan qaç: yoxlayıcı onları tez tanıyır. Eyni fikri mövzuya uyğun öz cümlənlə yaz.`);

  // --- Məzmun və bağlayıcılar (B) ---
  const examples = findPhrases(text, ["for example", "for instance", "such as"]);
  if (!examples.length) {
    content.push(`Fikirlərini nümunə ilə göstərməmisən. "Idea → Explain → Example" modelini yada sal: fikri de, onu izah et ("This is because ..."), sonra "For example, ..." ilə real həyatdan konkret misal gətir.`);
    next.push("ən azı bir konkret nümunə vermək");
  } else good.push(`fikrini nümunə ilə göstərmisən ("${examples[0]}")`);

  if (!findPhrases(text, ["because", "since", "due to", "because of"]).length)
    content.push(`Səbəb bildirən sözlər yoxdur. Fikrini əsaslandırmaq üçün "because", "since" və ya "This is because ..." işlət.`);

  const linkers = findPhrases(text, LINKERS);
  if (linkers.length < 3) {
    const missing = LINKER_GROUPS.filter(g => !g.list.some(l => linkers.includes(l)));
    content.push(`Bağlayıcı sözlərin azdır (${linkers.length ? "yalnız " + linkers.map(l => `"${l}"`).join(", ") : "heç biri yoxdur"}). ` +
      (missing.length ? `Məsələn, ${missing.slice(0, 3).map(g => `${g.name} üçün "${g.ex}"`).join(", ")} işlədə bilərsən. ` : "") +
      `Amma hər cümləyə bağlayıcı qoymaq lazım deyil: onlar bəzək üçün yox, fikirləri əlaqələndirmək üçündür.`);
    next.push("daha çox fərqli bağlayıcı işlətmək");
  } else good.push("bağlayıcılardan yerində istifadə etmisən");

  const opposing = findPhrases(text, ["some people", "others believe", "others argue", "opponents", "on the other hand", "however"]).length > 0;
  const response = findPhrases(text, ["although", "even though", "despite", "nevertheless"]).length > 0;
  if (!opposing) {
    content.push(`Əks fikri yazmamısan. İmtahanda obyektivlik vacibdir: "However, some people argue that ..." ilə qarşı tərəfin fikrini yaz, sonra "Although this might be true, ..." ilə cavab ver və öz mövqeyinə qayıt.`);
    next.push("əks fikir və ona cavab yazmaq");
  } else if (!response) {
    content.push(`Əks fikri yazmısan, amma ona cavab verməmisən. Ardınca "Although this might be true, ..." və ya "Despite this, ..." ilə cavab ver və öz fikrinə qayıt.`);
  } else good.push("əks fikri yazıb ona cavab vermisən");

  const opinion = findPhrases(text, OPINION_MARKERS);
  if (!opinion.length)
    content.push(`Öz mövqeyini açıq bildirməmisən. "I believe that ..." və ya "In my opinion, ..." ilə bir dəfə fikrini de, bu kifayətdir.`);
  else if (opinion.length >= 3)
    content.push(`"I think", "I believe", "In my opinion" kimi ifadələri bir neçə dəfə işlətmisən. Fikrini bildirmək üçün bir dəfə demək kifayətdir.`);

  // --- Cümlələr (C) ---
  const lengths = sentences.map(s => getWords(s).length);
  const shortIdx = lengths.map((l, i) => l < 8 ? i : -1).filter(i => i >= 0);
  const complex = sentences.filter(s => findPhrases(s, COMPLEX_MARKERS).length > 0).length;
  const mostlyShort = sentences.length > 0 && shortIdx.length / sentences.length > 0.5;
  if (mostlyShort) {
    grammar.push(`Cümlələrinin çoxu qısadır (${shortIdx.length} cümlə 8 sözdən azdır), məsələn: ${quote(sentences[shortIdx[0]])}. Belə cümlələri "because", "which", "although", "when" ilə birləşdir. Məsələn: "Online learning is convenient because students can study from home."`);
    next.push("qısa cümlələri birləşdirmək");
  }
  if (complex < 2)
    grammar.push(`Mürəkkəb cümlələrin azdır (${complex}). Paraqrafda ən azı 2-3 belə cümlə olsun: "... because ...", "... which ...", "Although ..., ...".`);
  else if (!mostlyShort) good.push("sadə və mürəkkəb cümlələri qarışıq işlətmisən");
  lengths.forEach((l, i) => {
    if (l > 40) grammar.push(`${i + 1}-ci cümlə çox uzundur (${l} söz). Oxucu fikri itirə bilər, onu iki cümləyə böl.`);
  });
  grammar.push(`Zaman, artikl və fel forması səhvlərini mən avtomatik yoxlaya bilmirəm, onları müəllimin ayrıca yoxlayacaq.`);

  // --- Söz ehtiyatı (D) ---
  const freq = {};
  words.filter(w => !FUNCTION_WORDS.has(w) && w.length > 1).forEach(w => { freq[w] = (freq[w] || 0) + 1; });
  const repeated = Object.entries(freq).filter(([, n]) => n >= 3).sort((a, b) => b[1] - a[1]);
  const topicW = getWords(res.topic || "");
  if (repeated.length) {
    const parts = repeated.slice(0, 4).map(([w, n]) => {
      const syn = SYNONYMS[w];
      const isTopic = topicW.some(t => t.slice(0, 5) === w.slice(0, 5));
      return `"${esc(w)}" (${n} dəfə)` +
        (syn ? ` – əvəzinə "${syn.join('", "')}" yaza bilərsən` : isTopic ? ` – mövzu sözüdür, amma bəzən "it/they" ilə əvəz et` : "");
    });
    vocab.push(`Bəzi sözləri çox təkrarlamısan: ${parts.join("; ")}. Parafraz et: sinonim işlət, sözün formasını dəyiş (məsələn "improve" → "improvement") və ya "it/they" kimi əvəzliklərdən istifadə et.`);
    next.push("təkrarlanan sözləri sinonimlərlə əvəz etmək");
  } else good.push("sözləri az təkrarlamısan");

  const topicHits = Object.keys(freq).filter(w => TOPIC_WORDS.has(w)).length;
  if (topicHits < 4)
    vocab.push(`Mövzuya uyğun güclü sözlər azdır. Kitabın lüğət bölməsindən "beneficial", "essential", "opportunity", "impact" kimi sözləri yerində işlətməyə çalış.`);
  else good.push("mövzuya uyğun sözlər işlətmisən");

  // --- Rəyi bir yerə yığ ---
  const t = res.total;
  let opening;
  if (t === 5) opening = next.length
    ? "Əla iş görmüsən! Bütün meyarlar ödənilib. Aşağıda yenə bir neçə kiçik tövsiyə yazıram ki, növbəti yazın daha da güclü olsun."
    : "Əla iş görmüsən! Paraqrafın quruluşu da, fikirlərin ardıcıllığı da yerindədir.";
  else if (t >= 3.5) opening = "Yaxşı işdir, tələblərin çoxunu yerinə yetirmisən. Gəl birlikdə baxaq, hansı məqamları düzəltsən tam bala yaxınlaşarsan.";
  else if (t >= 2) opening = "Yaxşı başlanğıcdır, amma paraqrafda bir neçə vacib hissə çatışmır. Narahat olma, gəl addım-addım baxaq.";
  else opening = "Bu dəfə bal aşağı alındı, amma bunların hamısı düzəldilə bilən şeylərdir. Gəl paraqrafı birlikdə hissə-hissə təhlil edək.";

  out.push(opening);
  if (res.aZero) out.push(`<b>Diqqət:</b> A meyarı 0 bal olduğu üçün imtahanda yekun bal 0 olur. Aşağıdakı ilk qeydləri mütləq düzəlt.`);
  if (good.length) out.push(`<b>Yaxşı alınanlar:</b> ${good.join(", ")}.`);
  if (structure.length) out.push(`<b>Quruluş.</b> ${structure.join(" ")}`);
  if (content.length) out.push(`<b>Məzmun və bağlayıcılar.</b> ${content.join(" ")}`);
  if (grammar.length) out.push(`<b>Cümlələr.</b> ${grammar.join(" ")}`);
  if (vocab.length) out.push(`<b>Söz ehtiyatı.</b> ${vocab.join(" ")}`);
  if (res.forgiven) out.push(`Bu dəfə ${res.forgiven} kiçik səhvə görə bal çıxmadım, amma onları da düzəltsən yazın daha güclü olacaq.`);
  out.push(next.length
    ? `<b>Növbəti yazında ilk növbədə:</b> ${next.slice(0, 3).map((s, i) => `${i + 1}) ${s}`).join("; ")}. Uğurlar!`
    : "Belə davam et. Uğurlar!");
  return out;
}

// Müəllimin izahı paneli
function renderTeacher(res) {
  return `
    <div class="panel teacher">
      <h2>Müəllimin izahı</h2>
      ${teacherFeedback(res).map(p => `<p>${p}</p>`).join("")}
    </div>`;
}

// Bütün nəticəni göstər
function renderResult(res) {
  const { A, B, C, D } = res.crit;
  const allFull = res.total === 5;
  const alerts = res.alerts.map(([cls, msg]) => `<div class="alert ${cls}">${esc(msg)}</div>`).join("");

  const html = `
    <div class="panel">
      ${alerts}
      <div class="summary">
        ${renderCircle(res.total)}
        <div class="summary-info">
          <h2>Ümumi bal: ${res.total} / 5</h2>
          <div class="stats">
            <span class="chip">${res.words.length} söz</span>
            <span class="chip">${res.sentences.length} cümlə</span>
            <span class="chip">A: ${A.score}</span><span class="chip">B: ${B.score}</span>
            <span class="chip">C: ${C.score}</span><span class="chip">D: ${D.score}</span>
          </div>
          ${allFull ? `<p class="final-msg good">Yaxşı iş! Bütün meyarlar ödənilib.</p>` : ""}
          ${res.forgiven ? `<p class="note">${res.forgiven} kiçik səhv görməzdən gəlindi (${FORGIVE_LIMIT} səhvə qədər bal azalmır).</p>` : ""}
          <p class="note">Bu təxmini bala əsaslanır. Mövzu, arqument və qrammatik səhvlər müəllim tərəfindən yoxlanmalıdır.</p>
        </div>
      </div>
    </div>
    <div class="cards">
      ${renderCard("A", A)}${renderCard("B", B)}${renderCard("C", C)}${renderCard("D", D)}
    </div>
    <div style="height:18px"></div>
    ${renderTeacher(res)}
    ${renderChecklist()}
    ${renderLegend()}`;

  const box = document.getElementById("result");
  box.innerHTML = html;
  box.style.display = "block";
  box.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ==========================================================
   7. HADİSƏLƏR (düymələr)
   ========================================================== */
const essayEl = document.getElementById("essay");

// Canlı söz sayı
essayEl.addEventListener("input", () => {
  document.getElementById("liveCount").textContent = getWords(essayEl.value).length + " söz";
});

document.getElementById("checkBtn").addEventListener("click", () => {
  const text = essayEl.value;
  if (!text.trim()) { essayEl.focus(); return; }
  renderResult(analyze(text, document.getElementById("topic").value));
});

document.getElementById("clearBtn").addEventListener("click", () => {
  essayEl.value = "";
  document.getElementById("liveCount").textContent = "0 söz";
  document.getElementById("result").style.display = "none";
});
</script>
</body>
</html>
