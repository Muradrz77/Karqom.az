<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kadr Studio – Video redaktor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@400;700;900&family=Bebas+Neue&family=Anton&family=Oswald:wght@400;700&family=Pacifico&family=Lobster&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,700;1,700&family=Dancing+Script:wght@700&family=Bangers&family=Roboto+Mono:wght@500&family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1013; --bg2:#17181d; --bg3:#1f2128; --bg4:#2a2d36; --line:#2f323c;
  --text:#e9eaee; --muted:#8b8f9c; --accent:#22d3c5; --accent2:#7c5cff; --danger:#ff5b6b;
  --vid:#2b6cb0; --img:#2f855a; --txt:#b7791f; --aud:#2c7a7b; --fx:#805ad5; --stk:#c05621;
  --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 Inter,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
input,select,textarea,button{font:inherit;color:inherit}
textarea,input[type=text]{user-select:text;-webkit-user-select:text}
button{cursor:pointer;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--text)}
button:hover{background:var(--bg4)}
button.primary{background:linear-gradient(135deg,var(--accent),#1aa9e0);border:none;color:#04201d;font-weight:700}
button.primary:hover{filter:brightness(1.1)}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--bg3)}
button:disabled{opacity:.4;cursor:default}
button.on{background:rgba(34,211,197,.15);border-color:var(--accent);color:var(--accent)}
select,input[type=text],input[type=number],textarea{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:5px 8px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=color]{width:34px;height:26px;border:1px solid var(--line);border-radius:6px;background:none;padding:1px;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#3a3d48;border-radius:6px}::-webkit-scrollbar-track{background:transparent}

#app{display:grid;grid-template-rows:48px minmax(200px,1fr) 6px var(--tlh,38%);height:100vh}
header{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:16px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.logo b{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#081018;font-size:14px}
header .grow{flex:1}
#projName{background:transparent;border:1px solid transparent;width:200px;text-align:center}
#projName:hover{border-color:var(--line)}
.hgroup{display:flex;gap:4px;align-items:center}

#top{display:grid;grid-template-columns:var(--lw,330px) 1fr var(--rw,320px);min-height:0}
#splitter{background:var(--bg2);cursor:ns-resize;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#splitter:hover{background:var(--accent)}

/* ---- left panel ---- */
#left{display:grid;grid-template-columns:64px 1fr;background:var(--bg2);border-right:1px solid var(--line);min-height:0}
#tabs{display:flex;flex-direction:column;gap:2px;padding:6px 4px;border-right:1px solid var(--line);overflow:auto}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border:none;background:transparent;color:var(--muted);font-size:10.5px}
#tabs button .ic{font-size:18px;line-height:1}
#tabs button.active,#tabs button:hover{color:var(--text);background:var(--bg3)}
#tabs button.active{color:var(--accent)}
#panel{overflow:auto;padding:12px;min-height:0}
.ptitle{font-weight:700;font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 8px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--text);background:rgba(34,211,197,.05)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
.card{position:relative;background:var(--bg3);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px}
.card:hover{border-color:var(--accent)}
.card img,.card canvas{width:100%;height:100%;object-fit:cover;display:block}
.card .lbl{position:absolute;left:0;right:0;bottom:0;padding:2px 5px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.card .dur{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.65);padding:0 4px;border-radius:4px;font-size:10px}
.card .add{position:absolute;right:4px;bottom:4px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#04201d;display:none;place-items:center;font-weight:800;border:none;padding:0}
.card:hover .add{display:grid}
.card.tall{aspect-ratio:1/1}
.card.emoji{font-size:30px;aspect-ratio:1}
.card .fxprev{width:100%;height:100%;display:grid;place-items:center;font-size:22px}
.chip{display:inline-block;padding:3px 8px;border-radius:20px;background:var(--bg3);border:1px solid var(--line);font-size:11px;margin:0 4px 4px 0;cursor:pointer}
.chip.active{border-color:var(--accent);color:var(--accent)}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.row label{flex:0 0 92px;color:var(--muted);font-size:12px}
.row .val{flex:0 0 44px;text-align:right;font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted)}
.row > input[type=range]{flex:1}
.hint{color:var(--muted);font-size:11.5px;line-height:1.5}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.btnrow button{flex:1;white-space:nowrap;padding:6px 6px}

/* ---- preview ---- */
#center{display:flex;flex-direction:column;min-width:0;min-height:0;background:#0b0c0f}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;padding:14px}
#cwrap{position:relative;box-shadow:0 0 0 1px #262832, 0 10px 40px rgba(0,0,0,.5);background:#000}
#cv{display:block;width:100%;height:100%}
#overlay{position:absolute;inset:0;pointer-events:none}
.sel-box{position:absolute;border:1.5px solid var(--accent);pointer-events:none;transform-origin:center center}
.sel-box .h{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--accent);border-radius:50%;pointer-events:auto}
.sel-box .h.tl{left:-7px;top:-7px;cursor:nwse-resize}.sel-box .h.tr{right:-7px;top:-7px;cursor:nesw-resize}
.sel-box .h.bl{left:-7px;bottom:-7px;cursor:nesw-resize}.sel-box .h.br{right:-7px;bottom:-7px;cursor:nwse-resize}
.sel-box .h.rot{left:50%;top:-30px;margin-left:-7px;cursor:grab;background:var(--accent)}
.sel-box .h.rot::after{content:"";position:absolute;left:3px;top:10px;width:2px;height:16px;background:var(--accent)}
.guide{position:absolute;background:#ff3ea5;pointer-events:none;display:none}
.guide.v{width:1px;top:0;bottom:0;left:50%}.guide.h{height:1px;left:0;right:0;top:50%}
#controls{height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;border-top:1px solid var(--line);background:var(--bg2)}
#timecode{font-variant-numeric:tabular-nums;font-family:'Roboto Mono',monospace;font-size:12px}
#timecode span{color:var(--muted)}
#playBtn{width:36px;height:30px;font-size:15px;padding:0}
#controls .grow{flex:1}

/* ---- right ---- */
#right{background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#ptabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#ptabs button{padding:4px 9px;border:none;background:transparent;color:var(--muted);font-size:12px}
#ptabs button.active{color:var(--text);background:var(--bg3)}
#props{flex:1;overflow:auto;padding:12px}
.empty{color:var(--muted);text-align:center;margin-top:40px;line-height:1.7}
.kf{width:22px;height:22px;padding:0;border:none;background:transparent;color:var(--muted);font-size:13px;flex:0 0 22px}
.kf.has{color:#ffd166}.kf.at{color:#ffd166;text-shadow:0 0 6px #ffd166}
.sect{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.seg{display:flex;background:var(--bg3);border-radius:7px;padding:2px;gap:2px;margin-bottom:8px}
.seg button{flex:1;border:none;background:transparent;padding:4px 6px;font-size:12px;color:var(--muted)}
.seg button.active{background:var(--bg4);color:var(--text)}

/* ---- timeline ---- */
#timeline{display:flex;flex-direction:column;background:var(--bg2);min-height:0}
#tltools{height:38px;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid var(--line)}
#tltools button{padding:4px 8px;font-size:12.5px}
#tltools .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#tltools .grow{flex:1}
#zoom{width:120px}
#tlbody{flex:1;display:grid;grid-template-columns:136px 1fr;min-height:0;position:relative}
#theads{overflow:hidden;border-right:1px solid var(--line);background:var(--bg2);position:relative}
#theads .spacer{height:28px;border-bottom:1px solid var(--line)}
.thead{display:flex;align-items:center;gap:2px;padding:0 6px;border-bottom:1px solid #22242b;font-size:11px;color:var(--muted)}
.thead .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thead button{padding:1px 3px;border:none;background:transparent;color:var(--muted);font-size:12px}
.thead button.off{color:var(--danger)}
#tscroll{overflow:auto;position:relative}
#tinner{position:relative;min-height:100%}
#ruler{position:sticky;top:0;height:28px;background:var(--bg2);border-bottom:1px solid var(--line);z-index:5;cursor:pointer}
#ruler canvas{position:absolute;left:0;top:0}
.track{position:relative;border-bottom:1px solid #22242b}
.track.main{background:rgba(255,255,255,.025)}
.track.droptarget{background:rgba(34,211,197,.08)}
.clip{position:absolute;top:3px;bottom:3px;border-radius:6px;overflow:hidden;cursor:grab;border:1.5px solid rgba(255,255,255,.12);background:var(--vid);color:#fff;font-size:11px}
.clip.sel{border-color:#fff;box-shadow:0 0 0 1.5px var(--accent)}
.clip.image{background:var(--img)}.clip.text{background:var(--txt)}.clip.audio{background:var(--aud)}.clip.fx,.clip.filter{background:var(--fx)}.clip.sticker,.clip.shape{background:var(--stk)}
.clip .thumbs{position:absolute;inset:0;display:flex;opacity:.9}
.clip .thumbs div{flex:0 0 auto;height:100%;background-size:cover;background-position:center;border-right:1px solid rgba(0,0,0,.3)}
.clip canvas.wave{position:absolute;left:0;bottom:0;height:100%;pointer-events:none}
.clip .cl{position:absolute;left:6px;top:2px;right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;pointer-events:none;font-weight:600}
.clip .badge{position:absolute;right:5px;bottom:2px;font-size:10px;background:rgba(0,0,0,.55);padding:0 4px;border-radius:4px;pointer-events:none}
.clip .hl,.clip .hr{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:2}
.clip .hl{left:0}.clip .hr{right:0}
.clip.sel .hl,.clip.sel .hr{background:rgba(255,255,255,.9)}
.clip.sel .hl::after,.clip.sel .hr::after{content:"";position:absolute;left:3px;top:35%;height:30%;width:2px;background:#333;border-radius:2px}
.clip .kfm{position:absolute;bottom:3px;width:8px;height:8px;background:#ffd166;transform:rotate(45deg);margin-left:-4px;pointer-events:none;border:1px solid #000}
.trans{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:4px;background:var(--bg);border:1.5px solid var(--muted);z-index:4;cursor:pointer;display:grid;place-items:center;font-size:10px;color:var(--muted)}
.trans:hover{border-color:var(--accent);color:var(--accent)}
.trans.has{background:var(--accent);border-color:#fff;color:#04201d}
#playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;z-index:8;pointer-events:none;margin-left:-1px}
#playhead::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid #fff}
.marker{position:absolute;top:16px;width:2px;height:12px;background:#ffd166;margin-left:-1px;z-index:6;cursor:pointer}
.beat{position:absolute;bottom:0;width:4px;height:4px;border-radius:50%;background:#ffd166;margin-left:-2px;pointer-events:none}
#snapline{position:absolute;top:0;bottom:0;width:1px;background:#ffd166;z-index:7;display:none;pointer-events:none}
.tl-empty{position:absolute;left:0;right:0;top:50%;text-align:center;color:var(--muted);pointer-events:none}

/* ---- modal / toast ---- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}
.modal-bg.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:20px;width:440px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h3{margin:0 0 14px;font-size:17px}
.prog{height:8px;background:var(--bg4);border-radius:8px;overflow:hidden;margin:12px 0}
.prog div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--bg4);border:1px solid var(--line);padding:9px 16px;border-radius:10px;z-index:200;transition:.25s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%);opacity:1}
#ctx{position:fixed;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:4px;z-index:150;display:none;min-width:170px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#ctx button{display:flex;justify-content:space-between;width:100%;border:none;background:transparent;text-align:left;padding:6px 10px;gap:16px}
#ctx button:hover{background:var(--bg4)}
#ctx button span{color:var(--muted);font-size:11px}
.kbd{display:inline-block;background:var(--bg4);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px;font-family:'Roboto Mono',monospace}
#dropAll{position:fixed;inset:0;background:rgba(34,211,197,.12);border:3px dashed var(--accent);z-index:90;display:none;align-items:center;justify-content:center;font-size:22px;font-weight:700;pointer-events:none}
#dropAll.show{display:flex}
#recDot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1s infinite;vertical-align:middle;margin-right:6px}
@keyframes blink{50%{opacity:.2}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><div class="mark">▶</div><span>Kadr <b>Studio</b></span></div>
    <div class="hgroup">
      <button class="ghost" id="newBtn" title="Yeni layihə">＋ Yeni</button>
      <button class="ghost" id="undoBtn" title="Geri al (Ctrl+Z)">↶</button>
      <button class="ghost" id="redoBtn" title="İrəli (Ctrl+Shift+Z)">↷</button>
    </div>
    <div class="grow"></div>
    <input id="projName" type="text" value="Layihəm" spellcheck="false">
    <div class="grow"></div>
    <span id="saveState" class="hint"></span>
    <button class="ghost" id="helpBtn" title="Qısayollar">⌨</button>
    <button class="primary" id="exportBtn">⬇ Eksport</button>
  </header>

  <div id="top">
    <div id="left">
      <div id="tabs"></div>
      <div id="panel"></div>
    </div>
    <div id="center">
      <div id="stage">
        <div id="cwrap">
          <canvas id="cv"></canvas>
          <div id="overlay"><div class="guide v"></div><div class="guide h"></div></div>
        </div>
      </div>
      <div id="controls">
        <div id="timecode">00:00.00 <span>/ 00:00.00</span></div>
        <div class="grow"></div>
        <button class="ghost" id="prevFrame" title="Əvvəlki kadr (←)">⏮</button>
        <button id="playBtn" title="Oynat (Boşluq)">▶</button>
        <button class="ghost" id="nextFrame" title="Növbəti kadr (→)">⏭</button>
        <div class="grow"></div>
        <select id="ratioSel" title="Ekran nisbəti"></select>
        <select id="pqSel" title="Önizləmə keyfiyyəti">
          <option value="1">Tam</option><option value="0.5" selected>1/2</option><option value="0.33">1/3</option>
        </select>
        <button class="ghost" id="snapBtn" title="Kadrı PNG kimi saxla">📷</button>
        <button class="ghost" id="fsBtn" title="Tam ekran">⛶</button>
      </div>
    </div>
    <div id="right">
      <div id="ptabs"></div>
      <div id="props"></div>
    </div>
  </div>

  <div id="splitter"></div>

  <div id="timeline">
    <div id="tltools">
      <button class="ghost" id="tSplit" title="Böl (S)">✂ Böl</button>
      <button class="ghost" id="tDel" title="Sil (Delete)">🗑</button>
      <button class="ghost" id="tDup" title="Dublikat (Ctrl+D)">⧉</button>
      <button class="ghost" id="tFreeze" title="Kadrı dondur">❄ Dondur</button>
      <button class="ghost" id="tDetach" title="Səsi ayır">🎵 Səsi ayır</button>
      <button class="ghost" id="tTrimL" title="Sol tərəfi playhead-ə qədər kəs (Q)">⇤</button>
      <button class="ghost" id="tTrimR" title="Sağ tərəfi playhead-dən kəs (W)">⇥</button>
      <div class="sep"></div>
      <button class="ghost" id="tMarker" title="Marker əlavə et (M)">🔖</button>
      <button class="ghost on" id="tMagnet" title="Əsas trek maqniti">🧲</button>
      <button class="ghost on" id="tSnap" title="Yapışma (snap)">⎍</button>
      <div class="grow"></div>
      <span class="hint" id="tlInfo"></span>
      <button class="ghost" id="zoomFit" title="Hamısını göstər">⤢</button>
      <span>🔍</span><input type="range" id="zoom" min="0" max="100" value="40">
    </div>
    <div id="tlbody">
      <div id="theads"><div class="spacer"></div><div id="theadList"></div></div>
      <div id="tscroll">
        <div id="tinner">
          <div id="ruler"><canvas id="rulerCv"></canvas></div>
          <div id="tracks"></div>
          <div id="snapline"></div>
          <div id="playhead"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<div id="ctx"></div>
<div id="dropAll">Faylları bura buraxın</div>
<input type="file" id="fileIn" multiple accept="video/*,audio/*,image/*" hidden>
<input type="file" id="srtIn" accept=".srt,.vtt,.txt" hidden>
<script>
'use strict';
/* =========================================================
   Kadr Studio — brauzerdə işləyən video redaktor
   Bütün emal lokal aparılır, fayllar heç yerə göndərilmir.
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmt(t, short) {
  t = Math.max(0, t || 0);
  const m = Math.floor(t / 60), s = t - m * 60;
  if (short) return m + ':' + String(Math.floor(s)).padStart(2, '0');
  return String(m).padStart(2, '0') + ':' + s.toFixed(2).padStart(5, '0');
}
function hexToRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }
function rand1(n) { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
function toast(msg, ms = 2200) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms); }

/* ---------------- Köməkçilər (model) ---------------- */
const VISUAL_KINDS = ['video', 'image', 'text', 'sticker', 'shape'];
function allClips() { const r = []; for (const t of P.tracks) for (const c of t.clips) r.push(c); return r; }
function findClip(id) { for (const t of P.tracks) for (const c of t.clips) if (c.id === id) return c; return null; }
function trackOf(clip) { return P.tracks.find(t => t.clips.includes(clip)); }
function getTrack(id) { return P.tracks.find(t => t.id === id); }
function mainTrack() { return P.tracks.find(t => t.kind === 'main'); }
function selClip() { return S.sel ? findClip(S.sel) : null; }
function projDur() { let d = 0; for (const c of allClips()) d = Math.max(d, c.start + c.dur); return d; }
function clipEnd(c) { return c.start + c.dur; }
function isVisual(c) { return VISUAL_KINDS.includes(c.kind); }
function hasAudio(c) { return (c.kind === 'video' || c.kind === 'audio'); }
function sortTrack(t) { t.clips.sort((a, b) => a.start - b.start); }
function trackAccepts(t, c) {
  if (t.kind === 'main') return c.kind === 'video' || c.kind === 'image';
  if (t.kind === 'visual') return isVisual(c);
  if (t.kind === 'fx') return c.kind === 'fx' || c.kind === 'filter';
  if (t.kind === 'audio') return c.kind === 'audio';
  return false;
}
function kindForClip(c) { return isVisual(c) ? 'visual' : (c.kind === 'audio' ? 'audio' : 'fx'); }
function overlaps(t, c, ignore) {
  for (const o of t.clips) { if (o === c || o === ignore) continue; if (c.start < o.start + o.dur - 1e-3 && c.start + c.dur > o.start + 1e-3) return true; }
  return false;
}
function newTrack(kind, afterTrack) {
  const t = { id: uid(), kind, clips: [], hidden: false, muted: false, locked: false };
  if (kind === 'audio') { P.tracks.push(t); return t; }
  // vizual treklər: audio-dan əvvəl, verilmiş trekin üstünə
  let idx;
  if (afterTrack) idx = P.tracks.indexOf(afterTrack) + 1;
  else { idx = P.tracks.findIndex(x => x.kind === 'audio'); if (idx < 0) idx = P.tracks.length; }
  P.tracks.splice(idx, 0, t);
  return t;
}
function cleanTracks() { P.tracks = P.tracks.filter(t => t.kind === 'main' || t.clips.length); }
function repackMain() {
  const m = mainTrack(); if (!m) return; sortTrack(m);
  if (!S.magnet) return;
  let x = 0; for (const c of m.clips) { c.start = x; x += c.dur; }
}
/** Klipi uyğun trekə yerləşdir (lazım olsa yeni trek yarat) */
function placeClip(c, pref) {
  let t = pref && trackAccepts(pref, c) ? pref : null;
  if (!t) {
    if (c.kind === 'video' || c.kind === 'image') t = mainTrack();
    else t = P.tracks.find(x => x.kind === kindForClip(c) && !overlaps(x, c));
  }
  if (t && t.kind === 'main' && S.magnet) {
    // ən yaxın sərhədə daxil et
    sortTrack(t);
    let idx = t.clips.length;
    for (let i = 0; i < t.clips.length; i++) { const o = t.clips[i]; if (c.start < o.start + o.dur / 2) { idx = i; break; } }
    t.clips.splice(idx, 0, c); repackMain(); return t;
  }
  if (!t || overlaps(t, c)) {
    const kind = t && t.kind === 'main' ? 'visual' : kindForClip(c);
    t = P.tracks.find(x => x.kind === kind && !overlaps(x, c)) || newTrack(kind, t && t.kind !== 'audio' ? t : null);
  }
  t.clips.push(c); sortTrack(t); return t;
}

const clock = { t0: 0, p0: 0 };
function play() {
  if (S.playing) return;
  ensureAudio();
  if (S.T >= projDur() - .02) S.T = 0;
  if (!projDur()) return;
  S.playing = true; clock.p0 = performance.now(); clock.t0 = S.T;
  $('#playBtn').textContent = '❚❚';
}
function pause() {
  S.playing = false; S.stopAt = null; $('#playBtn').textContent = '▶';
  for (const v of els.values()) { if (!v.el.paused) v.el.pause(); setGain(v, 0); }
  S.dirty = true; refreshProps(true);
}
function togglePlay() { S.playing ? pause() : play(); }
function loop(now) {
  requestAnimationFrame(loop);
  if (S.playing) {
    S.T = clock.t0 + (now - clock.p0) / 1000;
    const d = projDur();
    if (S.stopAt != null && S.T >= S.stopAt) { S.T = S.stopAt; pause(); }
    else if (S.T >= d) { S.T = d; if (S.exporting) { exportTick(true); } else pause(); }
    sync(S.T, S.playing);
    renderFrame(Math.min(S.T, Math.max(0, d - 1e-3)));
    drawSelection(); updatePlayhead();
    if (S.exporting) exportTick(false);
    else {
      const x = S.T * S.pps; if (x > tscroll.scrollLeft + tscroll.clientWidth - 40 || x < tscroll.scrollLeft) tscroll.scrollLeft = x - 60;
    }
  } else if (S.dirty) {
    S.dirty = false; sync(S.T, false);
    renderFrame(Math.min(S.T, Math.max(0, projDur() - 1e-3)));
    drawSelection(); updatePlayhead();
  }
}

  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = async () => {
    s.getTracks().forEach(t => t.stop()); pause(); clearInterval(recState.iv);
    const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
    recState = null; updateRecUI();
    const [m] = await importFiles([new File([blob], 'Səs yazısı ' + new Date().toLocaleTimeString() + '.webm', { type: blob.type })]);
    if (m) { const c = makeMediaClip(m, t0); placeClip(c); commit(); select(c.id); refreshAll(); toast('🎙 Səs yazısı əlavə edildi'); }
  };
  rec.start();
  recState = { rec, t0, started: performance.now(), iv: setInterval(updateRecUI, 250) };
  if (projDur() > S.T) play();
  updateRecUI();
}
function updateRecUI() {
  const b = $('#recBtn'), st = $('#recState'); if (!b) return;
  b.textContent = recState ? '⏹ Yazını dayandır' : '🎙 Səs yaz (voiceover)';

  st.innerHTML = recState ? `<span id="recDot"></span>Yazılır… ${fmt((performance.now() - recState.started) / 1000)}` : 'Playhead mövqeyindən başlayaraq mikrofondan səs yazılır.';
}
const SFX_LIST = [['whoosh', 'Vuş', '💨'], ['pop', 'Pop', '🫧'], ['ding', 'Zəng', '🔔'], ['click', 'Klik', '🖱'], ['boom', 'Bum', '💥'], ['beep', 'Bip', '📟'], ['riser', 'Yüksəliş', '📈'], ['applause', 'Alqış', '👏'], ['cash', 'Kassa', '💰'], ['beat', 'Ritm loop', '🥁']];
async function synthSfx(id, name) {
  const sr = 44100, D = { whoosh: .9, pop: .16, ding: 1.8, click: .06, boom: 1.8, beep: .35, riser: 2.6, applause: 3.2, cash: 1.2, beat: 8 }[id];
  const oc = new OfflineAudioContext(2, Math.ceil(sr * D), sr), out = oc.destination;
  const noiseBuf = () => { const b = oc.createBuffer(1, Math.ceil(sr * D), sr); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; };
  const nsrc = (buf) => { const s = oc.createBufferSource(); s.buffer = buf || noiseBuf(); return s; };
  const gain = (v) => { const g = oc.createGain(); g.gain.value = v; return g; };
  const filt = (type, f, q = 1) => { const b = oc.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };
  const tone = (type, f0, f1, t, dur, vol) => {
    const o = oc.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur * .8);
    const g = oc.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + dur + .02);
  };
  const nb = noiseBuf();
  const hit = (t, dur, vol, type, f) => { const s = nsrc(nb); const fl = filt(type, f, .8); const g = oc.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); s.connect(fl).connect(g).connect(out); s.start(t, Math.random() * 2); s.stop(t + dur + .02); };
  switch (id) {
    case 'whoosh': { const s = nsrc(); const bp = filt('bandpass', 300, 1.4); bp.frequency.setValueAtTime(250, 0); bp.frequency.exponentialRampToValueAtTime(3800, D * .55); bp.frequency.exponentialRampToValueAtTime(700, D); const g = gain(0); g.gain.linearRampToValueAtTime(1.2, D * .5); g.gain.linearRampToValueAtTime(0, D); s.connect(bp).connect(g).connect(out); s.start(); break; }
    case 'pop': tone('sine', 900, 140, 0, .15, .9); break;
    case 'ding': tone('sine', 1318.5, 1318.5, 0, D, .5); tone('sine', 2637, 2637, 0, D * .6, .15); tone('sine', 3951, 3951, 0, D * .3, .06); break;
    case 'click': hit(0, .03, .9, 'highpass', 2500); tone('square', 2000, 1500, 0, .02, .2); break;
    case 'boom': tone('sine', 110, 32, 0, D, 1); hit(0, .6, .8, 'lowpass', 500); break;
    case 'beep': { const o = oc.createOscillator(); o.type = 'square'; o.frequency.value = 1000; const g = gain(0); g.gain.linearRampToValueAtTime(.22, .01); g.gain.setValueAtTime(.22, D - .03); g.gain.linearRampToValueAtTime(0, D); o.connect(g).connect(out); o.start(); o.stop(D); break; }
    case 'riser': {
      const s = nsrc(); const bp = filt('bandpass', 200, 2); bp.frequency.exponentialRampToValueAtTime(7000, D); const g = gain(0); g.gain.linearRampToValueAtTime(.9, D - .05); g.gain.linearRampToValueAtTime(0, D); s.connect(bp).connect(g).connect(out); s.start();
      const o = oc.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(110, 0); o.frequency.exponentialRampToValueAtTime(880, D); const g2 = gain(0); g2.gain.linearRampToValueAtTime(.12, D - .05); g2.gain.linearRampToValueAtTime(0, D); o.connect(g2).connect(out); o.start(); o.stop(D); break;
    }
    case 'applause': for (let i = 0; i < 420; i++) { const t = Math.random() * (D - .1), env = Math.sin(Math.PI * t / D); hit(t, .02 + Math.random() * .03, .25 * env + .02, 'bandpass', 1200 + Math.random() * 2500); } break;
    case 'cash': hit(0, .05, .8, 'highpass', 3000); hit(.08, .05, .6, 'highpass', 3000); tone('sine', 2093, 2093, .12, 1, .35); tone('sine', 2637, 2637, .16, 1, .3); break;
    case 'beat': {
      const bpm = 120, sp = 60 / bpm;
      for (let i = 0; i * sp < D - .01; i++) { const t = i * sp; tone('sine', 150, 42, t, .32, 1); if (i % 2) { hit(t, .18, .55, 'highpass', 1400); tone('triangle', 220, 180, t, .1, .25); } }
      for (let i = 0; i * sp / 2 < D - .01; i++) hit(i * sp / 2 + (i % 2 ? .01 : 0), .05, i % 2 ? .12 : .2, 'highpass', 7500);
      break;
    }
  }
  const ab = await oc.startRendering();
  return new File([wavEncode(ab)], name + '.wav', { type: 'audio/wav' });
}
function wavEncode(ab) {
  const ch = ab.numberOfChannels, n = ab.length, sr = ab.sampleRate, buf = new ArrayBuffer(44 + n * ch * 2), v = new DataView(buf);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * ch * 2, true); ws(8, 'WAVE'); ws(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, ch, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * ch * 2, true); v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * ch * 2, true);
  const data = []; for (let c = 0; c < ch; c++) data.push(ab.getChannelData(c));
  let o = 44; for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) { const s = clamp(data[c][i], -1, 1); v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true); o += 2; }
  return new Blob([buf], { type: 'audio/wav' });
}

/* =========================================================
   YADDAŞ (IndexedDB avtosaxlama)
   ========================================================= */
const DB = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('kadr-studio', 1);
        r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('media')) d.createObjectStore('media', { keyPath: 'id' }); if (!d.objectStoreNames.contains('proj')) d.createObjectStore('proj'); };
        r.onsuccess = () => { this.db = r.result; res(true); }; r.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  tx(store, mode, fn) {
    return new Promise(res => {
      if (!this.db) return res(null);
      try { const t = this.db.transaction(store, mode), r = fn(t.objectStore(store)); t.oncomplete = () => res(r ? (r.result === undefined ? true : r.result) : true); t.onerror = () => res(null); t.onabort = () => res(null); }
      catch (e) { res(null); }
    });
  },
  saveMedia(m) { if (!m || !media[m.id]) return; return this.tx('media', 'readwrite', s => s.put({ id: m.id, name: m.name, type: m.type, blob: m.blob, duration: m.duration, w: m.w, h: m.h, thumbs: m.thumbs, peaks: m.peaks, beats: m.beats, hasAudio: m.hasAudio })); },
  del(store, id) { return this.tx(store, 'readwrite', s => s.delete(id)); },
  getAll(store) { return this.tx(store, 'readonly', s => s.getAll()); },
  get(store, k) { return this.tx(store, 'readonly', s => s.get(k)); },
  put(store, k, v) { return this.tx(store, 'readwrite', s => s.put(v, k)); },
  clear() { return Promise.all([this.tx('media', 'readwrite', s => s.clear()), this.tx('proj', 'readwrite', s => s.clear())]); }
};
let saveT = 0;
function scheduleSave() {
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    if (!DB.db) return;
    $('#saveState').textContent = 'Saxlanılır…';
    const ok = await DB.put('proj', 'current', JSON.stringify(P));
    $('#saveState').textContent = ok ? '✓ Avtomatik saxlanıldı' : '';
  }, 1200);
}
async function tryRestore() {
  if (!(await DB.open())) return;
  const pj = await DB.get('proj', 'current'); if (!pj || typeof pj !== 'string') return;
  let p; try { p = JSON.parse(pj); } catch (e) { return; }
  const n = (p.tracks || []).reduce((a, t) => a + t.clips.length, 0);
  if (!n) return;
  openModal(`<h3>🗂 Son layihə tapıldı</h3><div class="hint">"<b>${esc(p.name || 'Layihə')}</b>" — ${n} klip. Davam etmək istəyirsiniz?</div>
  <div class="btnrow" style="margin-top:14px"><button id="rsNew">Yeni layihə</button><button class="primary" id="rsGo">Bərpa et</button></div>`);
  $('#rsNew').onclick = async () => { closeModal(); await DB.clear(); };
  $('#rsGo').onclick = async () => {
    closeModal(); toast('Bərpa olunur…');
    const recs = (await DB.getAll('media')) || [];
    for (const r of recs) {
      const m = Object.assign({}, r, { url: URL.createObjectURL(r.blob) });
      if (m.type === 'image') { const img = new Image(); img.src = m.url; try { await img.decode(); m.img = img; } catch (e) { continue; } }
      media[m.id] = m;
    }
    P = p; S.sel = null; S.T = 0; H.stack = []; H.idx = -1;
    $('#projName').value = P.name || 'Layihəm';
    applyRatio(false); commit(); refreshAll(); renderLeft();
    for (const m of Object.values(media)) if (!m.thumbs || !m.thumbs.length || ((m.type !== 'image') && !m.peaks)) postProcessMedia(m);
    toast('✓ Layihə bərpa edildi');
  };
}
async function newProjectAction() {
  if (allClips().length && !confirm('Cari layihə silinəcək. Davam edilsin?')) return;
  pause();
  for (const id of [...els.keys()]) dropEl(id);
  for (const k in media) { try { URL.revokeObjectURL(media[k].url); } catch (e) { } delete media[k]; }
  P = newProject(); S.sel = null; S.T = 0; H.stack = []; H.idx = -1;
  $('#projName').value = P.name;
  await DB.clear(); applyRatio(false); commit(); refreshAll(); renderLeft();
}

/* =========================================================
   KLAVİATURA, DÜYMƏLƏR, BAŞLATMA
   ========================================================= */
window.addEventListener('keydown', e => {
  const tg = e.target;
  if (tg.matches('input[type=text],input[type=number],textarea,select')) { if (e.key === 'Escape') tg.blur(); return; }
  if ($('#modalBg').classList.contains('show')) { if (e.key === 'Escape' && !S.exporting) closeModal(); return; }
  const k = e.key, mod = e.ctrlKey || e.metaKey, lk = k.toLowerCase();
  if (tg.matches('input[type=range]') && (k.startsWith('Arrow'))) return;
  if (k === ' ') { e.preventDefault(); togglePlay(); }
  else if (mod && lk === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && lk === 'y') { e.preventDefault(); redo(); }
  else if (mod && lk === 'd') { e.preventDefault(); duplicateSel(); }
  else if (mod && lk === 'c') { copySel(); }
  else if (mod && lk === 'v') { pasteClip(); }
  else if (mod && lk === 'b') { e.preventDefault(); splitSel(); }
  else if (mod && lk === 's') { e.preventDefault(); scheduleSave(); toast('Layihə avtomatik saxlanılır'); }
  else if (mod && lk === 'e') { e.preventDefault(); exportDialog(); }
  else if (mod) return;
  else if (lk === 's') splitSel();
  else if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); deleteSel(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); pause(); seek(S.T - (e.shiftKey ? 1 : 1 / 30)); refreshProps(true); }
  else if (k === 'ArrowRight') { e.preventDefault(); pause(); seek(S.T + (e.shiftKey ? 1 : 1 / 30)); refreshProps(true); }
  else if (k === 'Home') seek(0);
  else if (k === 'End') seek(projDur());
  else if (lk === 'm') addMarker();
  else if (lk === 'q') trimTo('l');
  else if (lk === 'w') trimTo('r');
  else if (k === '+' || k === '=') setZoom(S.pps * 1.25);
  else if (k === '-') setZoom(S.pps / 1.25);
  else if (k === 'Escape') { select(null); S.pickColor = null; }
});
function helpDialog() {
  const rows = [['Boşluq', 'Oynat / dayandır'], ['S və ya Ctrl+B', 'Playhead-də böl'], ['Delete', 'Klipi sil'], ['Ctrl+D', 'Dublikat'], ['Ctrl+C / Ctrl+V', 'Kopyala / yapışdır'], ['Ctrl+Z / Ctrl+Shift+Z', 'Geri al / irəli'], ['← / →', '1 kadr geri/irəli (Shift: 1 san)'], ['Q / W', 'Sol/sağ hissəni playhead-ə qədər kəs'], ['M', 'Marker əlavə et'], ['+ / −, Ctrl+təkər', 'Taymlaynı böyüt/kiçilt'], ['Home / End', 'Əvvələ / sona'], ['Ctrl+E', 'Eksport'], ['Esc', 'Seçimi ləğv et']];
  openModal(`<h3>⌨ Klaviatura qısayolları</h3>${rows.map(([a, b]) => `<div class="row"><label style="flex:0 0 160px"><span class="kbd">${a}</span></label><span>${b}</span></div>`).join('')}
  <div class="hint" style="margin-top:8px">Önizləmədə klipi sürükləyərək yerini, künclərdən ölçüsünü, yuxarı dairədən fırlanmasını dəyişin. Mətnə iki dəfə klik edərək redaktə edin.</div>
  <div class="btnrow" style="margin-top:14px"><button class="primary" onclick="closeModal()">Bağla</button></div>`);
}
/* Proqram önizləmə pəncərəsində və ya telefonda açılıbsa xəbərdarlıq */
function envWarning() {
  let framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
  const mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || Math.min(innerWidth, innerHeight) < 600;
  if (!framed && !mobile) return;
  openModal(`<h3>⚠️ Fayl əlavə etmək işləməyə bilər</h3>
  <div class="hint" style="font-size:13px">${framed ? 'Proqram başqa tətbiqin daxilində (önizləmə pəncərəsində) açılıb. Bu rejimdə brauzer fayl seçməyə və sürükləyib atmağa icazə vermir.' : 'Proqram telefonda/kiçik ekranda açılıb. Kadr Studio kompüter üçün hazırlanıb: sürükləyib atmaq telefonda işləmir və ekran çox sıx olur.'}
  <br><br><b>Həlli:</b><br>1. <b>video_editor.html</b> faylını kompüterə <b>yükləyin</b> (Download).<br>2. Fayla sağ klik → <b>Open with → Google Chrome</b>.<br>3. <b>＋ İdxal</b> düyməsini basın və ya videonu pəncərəyə sürükləyin.</div>
  <div class="btnrow" style="margin-top:14px"><button onclick="closeModal()">Yenə də davam et</button></div>`);
}
function init() {
  $('#ratioSel').innerHTML = Object.keys(RATIOS).map(k => `<option value="${k}">${RATIO_NAMES[k]}</option>`).join('');
  $('#ratioSel').onchange = e => { P.ratio = e.target.value; applyRatio(true); commit(); refreshProps(); };
  $('#pqSel').onchange = e => { S.pq = +e.target.value; applyRatio(false); };
  $('#playBtn').onclick = togglePlay;
  $('#prevFrame').onclick = () => { pause(); seek(S.T - 1 / 30); };
  $('#nextFrame').onclick = () => { pause(); seek(S.T + 1 / 30); };
  $('#undoBtn').onclick = undo; $('#redoBtn').onclick = redo;
  $('#newBtn').onclick = newProjectAction;
  $('#exportBtn').onclick = exportDialog;
  $('#helpBtn').onclick = helpDialog;
  $("#snapBtn").onclick = saveFrame;
  $('#fsBtn').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else cwrap.requestFullscreen && cwrap.requestFullscreen(); };
  document.addEventListener('fullscreenchange', () => { if (document.fullscreenElement) { cwrap.style.width = '100vw'; cwrap.style.height = '100vh'; cv.style.objectFit = 'contain'; } else { cv.style.objectFit = ''; fitStage(); } });
  $('#tSplit').onclick = splitSel; $('#tDel').onclick = deleteSel; $('#tDup').onclick = duplicateSel;
  $('#tFreeze').onclick = freezeFrame; $('#tDetach').onclick = detachAudio;
  $('#tTrimL').onclick = () => trimTo('l'); $('#tTrimR').onclick = () => trimTo('r');
  $('#tMarker').onclick = addMarker;
  $('#tMagnet').onclick = e => { S.magnet = !S.magnet; e.currentTarget.classList.toggle('on', S.magnet); if (S.magnet) { repackMain(); commit(); refreshAll(); } toast('Maqnit ' + (S.magnet ? 'aktiv' : 'deaktiv')); };
  $('#tSnap').onclick = e => { S.snap = !S.snap; e.currentTarget.classList.toggle('on', S.snap); toast('Yapışma ' + (S.snap ? 'aktiv' : 'deaktiv')); };
  $('#projName').onchange = e => { P.name = e.target.value; commit(); };
  $('#fileIn').onchange = async e => { const f = [...e.target.files]; e.target.value = ''; ensureAudio(); const add = await importFiles(f); if (add.length) toast(add.length + ' fayl idxal edildi'); if (add.length && !allClips().length) for (const m of add) addMediaToTimeline(m, true); };
  $('#srtIn').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; const items = parseSRT(await f.text()); if (!items.length) { toast('Subtitr tapılmadı'); return; } addSubtitles(items); };
  $('#modalBg').addEventListener('pointerdown', e => { if (e.target.id === 'modalBg' && !S.exporting && !$('#rsGo')) closeModal(); });
  // fayl sürükləmə
  let dragN = 0;
  window.addEventListener('dragenter', e => { if (e.dataTransfer.types.includes('Files')) { dragN++; $('#dropAll').classList.add('show'); } });
  window.addEventListener('dragleave', e => { if (e.dataTransfer.types.includes('Files') && --dragN <= 0) { dragN = 0; $('#dropAll').classList.remove('show'); } });
  window.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
  window.addEventListener('drop', async e => {
    if (!e.dataTransfer.files.length) return;
    e.preventDefault(); dragN = 0; $('#dropAll').classList.remove('show'); ensureAudio();
    const toTl = !!e.target.closest('#timeline') || !allClips().length;
    const add = await importFiles([...e.dataTransfer.files], { addToTimeline: toTl });
    if (add.length) toast(add.length + ' fayl idxal edildi');
  });
  // taymlayn hündürlüyü

    const mv = ev => { const hh = clamp(innerHeight - ev.clientY - 3, 140, innerHeight - 260); $('#app').style.setProperty('--tlh', hh + 'px'); };
    const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); fitStage(); renderTimeline(); };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
  });
  new ResizeObserver(() => { fitStage(); drawRuler(); }).observe($('#stage'));
  window.addEventListener('resize', () => renderTimeline());
  document.fonts && document.fonts.ready.then(() => { textCache.clear(); S.dirty = true; });
  $('#zoom').value = Math.round(Math.log2(S.pps / 4) / Math.log2(700 / 4) * 100);
  renderLeft(); applyRatio(false); commit(); refreshAll();
  envWarning();
  requestAnimationFrame(loop);
  tryRestore();
}
